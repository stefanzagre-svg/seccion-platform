<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Cyan to Magenta 3D Glass Gradient -->
    <linearGradient id="seccion-glass-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00fbfb" />
      <stop offset="45%" stop-color="#00c8ff" />
      <stop offset="75%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ffabf3" />
    </linearGradient>

    <!-- Neon Tube Glow Filter -->
    <filter id="seccion-glass-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glass Tube 3D Glow -->
  <path 
    d="M42 17 C42 12.5 37.5 9 32 9 C25.5 9 21 13 21 18.5 C21 26 43 26.5 43 35.5 C43 41.8 37.8 46 31.5 46 C24.5 46 20 41.5 20 37" 
    stroke="url(#seccion-glass-grad)" 
    stroke-width="7" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#seccion-glass-glow)"
  />

  <!-- Core White Filament Line -->
  <path 
    d="M42 17 C42 12.5 37.5 9 32 9 C25.5 9 21 13 21 18.5 C21 26 43 26.5 43 35.5 C43 41.8 37.8 46 31.5 46 C24.5 46 20 41.5 20 37" 
    stroke="#FFFFFF" 
    stroke-width="2.2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Specular Gloss Terminal Nodes -->
  <circle cx="42" cy="17" r="3" fill="#ffabf3" />
  <circle cx="20" cy="37" r="3" fill="#00fbfb" />
</svg>
