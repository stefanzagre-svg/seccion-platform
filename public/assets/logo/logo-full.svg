<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" fill="none">
  <defs>
    <!-- Cyan to Magenta Neon Gradient -->
    <linearGradient id="lf-neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="lf-wm-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#66FCF1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="lf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Mark (Clean Transparent) -->
  <g transform="translate(8, 4) scale(1.0)">
    <path 
      d="M42 18.5 C42 13.8 37.5 10 32 10 C25.5 10 21 14.2 21 19.5 C21 27 43 27.5 43 36.5 C43 42.8 37.8 47 31.5 47 C24.5 47 20 42.2 20 37.5" 
      stroke="url(#lf-neon-grad)" 
      stroke-width="5.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      filter="url(#lf-glow)"
    />
    <path 
      d="M42 18.5 C42 13.8 37.5 10 32 10 C25.5 10 21 14.2 21 19.5 C21 27 43 27.5 43 36.5 C43 42.8 37.8 47 31.5 47 C24.5 47 20 42.2 20 37.5" 
      stroke="#FFFFFF" 
      stroke-width="1.8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.95"
    />
    <circle cx="42" cy="18.5" r="2.2" fill="#00F0FF" />
    <circle cx="20" cy="37.5" r="2.2" fill="#EC4899" />
  </g>

  <!-- Right Wordmark (Clean Transparent with Slashed Orbital 'O') -->
  <g transform="translate(82, 16) scale(1.25)" stroke="url(#lf-wm-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#lf-glow)">
    <!-- 'S' -->
    <path d="M 24 13 C 24 10 20 8 16 8 C 11 8 8 11 8 15 C 8 21 24 21 24 27 C 24 31 20 34 14 34 C 9 34 7 31 7 28" />
    <!-- 'E' -->
    <path d="M 46 8 L 33 8 L 33 34 L 46 34 M 33 21 L 43 21" />
    <!-- 'C' -->
    <path d="M 67 12 C 64 9 59 8 54 8 C 47 8 43 13 43 21 C 43 29 47 34 54 34 C 60 34 65 31 67 27" />
    <!-- 'C' -->
    <path d="M 89 12 C 86 9 81 8 76 8 C 69 8 65 13 65 21 C 65 29 69 34 76 34 C 82 34 87 31 89 27" />
    <!-- 'I' -->
    <path d="M 98 8 L 98 34 M 93 8 L 103 8 M 93 34 L 103 34" />
    <!-- Slashed Orbital 'O' -->
    <ellipse cx="121" cy="21" rx="10" ry="13" />
    <path d="M 107 35 L 135 7" stroke="#EC4899" stroke-width="2.5" />
    <!-- 'N' -->
    <path d="M 143 34 L 143 8 L 163 34 L 163 8" />
  </g>
</svg>
