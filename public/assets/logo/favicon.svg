<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Cyan to Magenta Neon Gradient -->
    <linearGradient id="seccion-neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="seccion-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Clean Transparent 3D Glass Tube "S" Icon -->
  <path 
    d="M42 18.5 C42 13.8 37.5 10 32 10 C25.5 10 21 14.2 21 19.5 C21 27 43 27.5 43 36.5 C43 42.8 37.8 47 31.5 47 C24.5 47 20 42.2 20 37.5" 
    stroke="url(#seccion-neon-grad)" 
    stroke-width="6" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#seccion-glow)"
  />

  <!-- Core Inner Electric Energy Line -->
  <path 
    d="M42 18.5 C42 13.8 37.5 10 32 10 C25.5 10 21 14.2 21 19.5 C21 27 43 27.5 43 36.5 C43 42.8 37.8 47 31.5 47 C24.5 47 20 42.2 20 37.5" 
    stroke="#FFFFFF" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    opacity="0.95"
  />

  <!-- Terminal Pulse Energy Nodes -->
  <circle cx="42" cy="18.5" r="2.5" fill="#00F0FF" />
  <circle cx="20" cy="37.5" r="2.5" fill="#EC4899" />
</svg>
